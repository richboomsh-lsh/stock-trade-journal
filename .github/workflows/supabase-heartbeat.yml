name: Supabase Heartbeat

on:
  schedule:
    # 매주 월요일·목요일 01:00 UTC = 한국시간 오전 10시
    - cron: '0 1 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: trades 테이블에 가벼운 조회 쿼리 보내기
        run: |
          curl -s -o /dev/null -w "HTTP 상태코드: %{http_code}\n" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/trades?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}"
