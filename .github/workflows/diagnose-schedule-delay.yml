name: 예약 지연 진단 (diagnose-schedule-delay)

# 목적: GitHub 예약 실행이 하루 중 어느 시각에 얼마나 늦게 시작되는지 기록한다.
# - 수집 워크플로우(collect-daily-market-data.yml)와는 완전히 별개이며,
#   저장소 코드/Secrets(KIS, Supabase)를 쓰지 않는다 → 한국투자증권 토큰 발급과 무관.
# - 각 실행은 몇 초 만에 끝나고, 'Actions 요약(Summary)' 화면에 지연 시간을 남긴다.
# - 진단이 끝나면(약 1주 후) 이 파일을 삭제하면 된다.

on:
  schedule:
    # 일부러 정각을 피해 7분에 예약 (정각은 GitHub가 붐비는 시각)
    - cron: '7 16 * * *'   # KST 01:07 (UTC 16:07)
    - cron: '7 22 * * *'   # KST 07:07 (UTC 22:07)
    - cron: '7 4 * * *'    # KST 13:07 (UTC 04:07)
    - cron: '7 10 * * *'   # KST 19:07 (UTC 10:07)
  workflow_dispatch:       # 수동 실행(테스트용)

permissions: {}

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 예약 시각 vs 실제 시작 시각 기록
        env:
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          now=$(date +%s)
          echo "실행 종류: $EVENT_NAME (#$RUN_NUMBER)"
          echo "예약 식(UTC): ${SCHEDULE_EXPR:-없음(수동 실행)}"
          echo "실제 시작(UTC): $(date -u '+%F %T')"
          echo "실제 시작(KST): $(TZ=Asia/Seoul date '+%F %T')"

          if [ -n "$SCHEDULE_EXPR" ]; then
            m=$(echo "$SCHEDULE_EXPR" | awk '{print $1}')
            h=$(echo "$SCHEDULE_EXPR" | awk '{print $2}')
            expected=$(date -u -d "today $(printf '%02d:%02d' "$h" "$m")" +%s)
            # 자정을 넘겨 늦게 시작된 경우를 위해, 예약 시각이 미래로 계산되면 하루 전으로 본다
            if [ "$expected" -gt "$now" ]; then expected=$((expected - 86400)); fi
            delay=$((now - expected))
            delay_min=$((delay / 60))
            planned_kst=$(TZ=Asia/Seoul date -d "@$expected" '+%F %H:%M')
            actual_kst=$(TZ=Asia/Seoul date -d "@$now" '+%F %H:%M')
            echo "예약 시각(KST): $planned_kst"
            echo "지연: ${delay_min}분"
            {
              echo "### 예약 지연 기록"
              echo ""
              echo "| 예약(KST) | 실제 시작(KST) | 지연 |"
              echo "|---|---|---|"
              echo "| $planned_kst | $actual_kst | ${delay_min}분 |"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=예약 지연::예약 $planned_kst → 실제 $actual_kst (지연 ${delay_min}분)"
          else
            echo "수동 실행이라 지연 계산은 생략합니다."
            echo "수동 실행: 로그 출력 형식 확인용" >> "$GITHUB_STEP_SUMMARY"
          fi
