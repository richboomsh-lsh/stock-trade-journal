name: 일별 종목 데이터 수집 (screening)

on:
  schedule:
    # 한국시간 평일 11:37 (UTC 02:37). 일부러 일찍 예약함:
    # GitHub 예약 실행이 이 시간대에 매번 5~7시간씩 밀려서(2026-10 관찰), 지연을 감안해 앞당김.
    # 너무 일찍 시작된 경우는 아래 '장 마감 후까지 대기' step이 16:15(KST)까지 기다린다.
    # 주의: 대기 + 수집(약 55분)이 job 최대 시간 6시간 안에 들어가야 하므로 11:37보다 더 앞당기지 말 것.
    - cron: '37 2 * * 1-5'
  workflow_dispatch:
    inputs:
      limit:
        description: '테스트용 종목 수 제한 (비워두면 전체 2,720종목 실행)'
        required: false
        default: ''

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: screening
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      # 예약 실행이 예상보다 일찍 시작되면 장중 데이터가 섞이므로(과거 오염 사례),
      # 한국시간 16:15 전이면 그 시각까지 기다린다. 수동 실행(workflow_dispatch)에는 적용하지 않는다.
      - name: 장 마감 후까지 대기 (예약 실행 전용)
        if: github.event_name == 'schedule'
        run: |
          now=$(date +%s)
          target=$(TZ=Asia/Seoul date -d "today 16:15" +%s)
          echo "현재(KST): $(TZ=Asia/Seoul date '+%F %T') / 목표: 16:15"
          if [ "$now" -lt "$target" ]; then
            wait_sec=$((target - now))
            echo "::notice title=장 마감 대기::${wait_sec}초 대기 후 수집을 시작합니다"
            sleep "$wait_sec"
          else
            echo "::notice title=대기 없음::이미 16:15 이후라 바로 수집합니다"
          fi

      # 관리종목/거래정지 등 '위험 지정' 상태는 매일 바뀌므로,
      # 수집을 시작하기 직전에 최신 종목마스터 파일로 플래그를 갱신한다.
      # continue-on-error: true → 이 step이 실패해도 job을 멈추지 않고 수집으로 넘어간다
      # (그 경우 어제까지 DB에 저장된 플래그로 수집이 진행됨)
      - name: 종목마스터 갱신 (위험종목 플래그)
        id: update_master
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/download_stock_master.py
          python scripts/upsert_stock_master.py

      # 위 step의 성공/실패를 Actions 요약 화면에 눈에 띄게 남긴다
      - name: 마스터 갱신 결과 확인
        if: always()
        run: |
          if [ "${{ steps.update_master.outcome }}" = "success" ]; then
            echo "::notice title=마스터 갱신 성공::오늘자 위험종목 플래그로 수집합니다"
          else
            echo "::warning title=마스터 갱신 실패::종목마스터 갱신에 실패했습니다 (outcome=${{ steps.update_master.outcome }}). 어제까지 저장된 플래그로 수집을 계속합니다. 위 '종목마스터 갱신' step 로그를 확인하세요."
          fi

      - name: 일별 데이터 수집 실행
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            python scripts/collect_daily_market_data.py --limit ${{ github.event.inputs.limit }}
          else
            python scripts/collect_daily_market_data.py
          fi

      - name: Run screening batch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONIOENCODING: utf-8
        run: python scripts/run_screening_batch.py
